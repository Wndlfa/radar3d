services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: radar3d
      POSTGRES_PASSWORD: radar3d
      POSTGRES_DB: radar3d
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar3d"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn radar3d.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m radar3d.workers.run
    env_file: .env
    environment:
      # Embeddings CLIP self-hosted (ver docs/plano §Fase 3). Trocar para "api"
      # quando houver provedor externo.
      EMBEDDINGS_PROVIDER: local_clip
      TRANSLATE_PROVIDER: glossary
    volumes:
      - ./backend:/app
      - models:/models  # cache dos pesos do modelo (evita rebaixar a cada run)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build: ./backend  # imagem alpine leve (sem torch) — só enfileira a coleta
    command: python -m radar3d.shopee.scheduler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started

  web:
    build: ./web
    command: npm run dev
    env_file: .env
    environment:
      # Server components (dentro do container) falam com a API pela rede do
      # Docker; o browser usa NEXT_PUBLIC_API_URL (localhost).
      API_URL_INTERNAL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  models:
