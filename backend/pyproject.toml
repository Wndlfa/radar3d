[project]
name = "radar3d"
version = "0.1.0"
description = "Radar3D backend — API + workers de coleta e matching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=1.16",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0", "pytest-asyncio>=0.23"]
# Embeddings self-hosted (worker Debian). torch é instalado à parte (CPU) no
# Dockerfile.worker; sentence-transformers o requer.
ml = ["sentence-transformers>=3.0", "pillow>=10.0", "argostranslate>=1.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar3d*"]
